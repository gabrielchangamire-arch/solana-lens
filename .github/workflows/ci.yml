name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust inspector
        run: npm run build:rust
      - name: Run Node and Rust tests
        run: npm run test:all
      - name: Check formatting
        run: cargo fmt --manifest-path rust/transaction-inspector/Cargo.toml --check
      - name: Build production container
        run: docker build --tag solana-lens:ci .
